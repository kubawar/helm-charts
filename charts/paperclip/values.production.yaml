# Production overlay example
# Usage: helm upgrade paperclip ./paperclip -f values.production.yaml

replicaCount: 1

server:
  deploymentMode: "authenticated"
  deploymentExposure: "private"
  publicUrl: "https://paperclip.wojna-z-it.pl"
  authDisableSignUp: true
  companyDeletionEnabled: false

ingress:
  enabled: true
  hosts:
    - host: paperclip.wojna-z-it.pl
      paths:
        - path: /
          pathType: Prefix

postgresql:
  enabled: false
  external:
    host: "paperclip-db.abc123.eu-west-2.rds.amazonaws.com"
    port: 5432
    database: "paperclip"
    username: "paperclip"
    existingSecret: "paperclip-db-credentials"
    sslMode: "require"
    connectionPooling: false

persistence:
  enabled: true
  size: 50Gi
  storageClass: "nfs-client"

backup:
  builtin:
    enabled: true
    intervalMinutes: 30
    retentionDays: 30
  
networkPolicy:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 4Gi
