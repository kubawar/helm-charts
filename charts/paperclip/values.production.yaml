# Production overlay example
# Usage: helm upgrade paperclip ./paperclip -f values.production.yaml

replicaCount: 1
image:
  repository: ghcr.io/paperclipai/paperclip
  # -- Overrides the image tag whose default is the chart appVersion
  tag: "2026.1023"
  pullPolicy: IfNotPresent

server:
  deploymentMode: "authenticated"
  deploymentExposure: "private"
  publicUrl: "https://paperclip.wojna-z-it.pl"
  authDisableSignUp: true
  companyDeletionEnabled: false
  
service:
  type: ClusterIP
  port: 80
  containerPort: 3100
  annotations: {}

ingress:
  enabled: true
  hosts:
    - host: paperclip.wojna-z-it.pl
      paths:
        - path: /
          pathType: Prefix

postgresql:
  # -- Enable bundled PostgreSQL subchart (for dev/staging)
  enabled: true
  auth:
    existingSecret: "paperclip-db-credentials"
  primary:
    persistence:
      storageClass: "nfs-client"

storage:
  # -- Storage provider: "s3" or "local_disk"
  provider: "local_disk"
  localDisk:
    persistence:
      storageClass: "nfs-client"

persistence:
  storageClass: "nfs-client"
  
networkPolicy:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 4Gi
